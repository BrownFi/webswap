<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" type="image/png" href="/Group.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/images/Group.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/images/Group.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff007a" />
    <meta name="fortmatic-site-verification" content="j93LgcVZk79qcgyo" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Self-hosted Geist + Inter (@font-face in src/theme/fonts.css) served
         from our own origin — removes the eager third-party webfont CSS+woff2
         critical-path chain on initial render. Preload the two most-used UI
         faces (Inter latin 400/500) so they start with the document; the rest
         load via @font-face with display=swap. crossorigin is required even
         same-origin because font fetches are CORS-anonymous. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-500-latin.woff2" crossorigin />

    <title>Brownfi Interface</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
